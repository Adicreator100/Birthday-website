<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Isha & Sneha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #073b9c;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100vw;
            height: 100vh;
            background-image: url("page1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start-button {
            position: absolute;
            bottom: 10.5%;
            left: 50%;
            transform: translateX(-50%);

            width: 180px;
            height: 58px;

            border: none;
            border-radius: 30px;

            background: rgba(120, 205, 255, 0.95);
            color: #073b9c;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);

            transition: 0.25s ease;
        }

        .start-button:hover {
            transform: translateX(-50%) scale(1.08);
        }

        .start-button:active {
            transform: translateX(-50%) scale(0.96);
        }
    </style>
</head>

<body>

    <div class="page">
        <button class="start-button" onclick="startWebsite()">
            Start →
        </button>
    </div>

    <script>
        function startWebsite() {
            alert("Page 2 coming next 😭");
        }
    </script>

</body>
</html>
