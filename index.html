<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Isha & Sneha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #073b9c;
            font-family: Arial, sans-serif;
        }

        /* =========================
           COMMON PAGE
        ========================= */

        .page,
        .page2,
        .page3,
        .games-page,
        .truth-dare-page,
        .would-you-rather-page {
            width: 100vw;
            height: 100vh;
        }

        /* =========================
           PAGE 1
        ========================= */

        .page {
            background-image: url("page1.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start-button {
            position: absolute;
            bottom: 10.5%;
            left: 50%;
            transform: translateX(-50%);

            width: 180px;
            height: 58px;

            border: none;
            border-radius: 30px;

            background: rgba(120, 205, 255, 0.95);
            color: #073b9c;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);

            transition: 0.25s ease;
        }

        .start-button:hover {
            transform: translateX(-50%) scale(1.08);
        }

        .start-button:active {
            transform: translateX(-50%) scale(0.96);
        }


        /* =========================
           PAGE 2
        ========================= */

        .page2 {
            display: none;

            background: linear-gradient(135deg, #073b9c, #1765c5);

            justify-content: center;
            align-items: center;
            flex-direction: column;

            color: white;
            text-align: center;

            padding: 20px;
        }

        .page2 h1 {
            font-size: 42px;
            margin-bottom: 50px;
        }

        .choices {
            display: flex;
            gap: 40px;

            justify-content: center;
            align-items: center;
        }

        .choice-button {
            width: 220px;
            height: 130px;

            border: none;
            border-radius: 25px;

            background: white;
            color: #073b9c;

            font-size: 25px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 25px rgba(0,0,0,0.25);

            transition: 0.2s;
        }

        .choice-button:hover {
            transform: scale(1.08);
        }


        /* =========================
           PAGE 3 - GIFT
        ========================= */

        .page3 {
            display: none;

            background: linear-gradient(135deg, #073b9c, #1765c5);

            justify-content: center;
            align-items: center;
            flex-direction: column;

            color: white;
            text-align: center;

            padding: 20px;
        }

        .page3 h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }

        .gift-box {
            font-size: 120px;
            margin-bottom: 30px;
        }

        .open-gift-button {
            width: 180px;
            height: 58px;

            border: none;
            border-radius: 30px;

            background: white;
            color: #073b9c;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 25px rgba(0,0,0,0.25);

            transition: 0.2s;
        }

        .open-gift-button:hover {
            transform: scale(1.08);
        }

        .gift-message {
            display: none;
            margin-top: 30px;
        }

        .gift-message h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .gift-message p {
            font-size: 22px;
        }


        /* =========================
           GAMES PAGE
        ========================= */

        .games-page {
            display: none;

            background: linear-gradient(135deg, #073b9c, #1765c5);

            justify-content: center;
            align-items: center;
            flex-direction: column;

            color: white;
            text-align: center;

            padding: 20px;
        }

        .games-page h1 {
            font-size: 42px;
            margin-bottom: 50px;
        }

        .game-buttons {
            display: flex;
            gap: 40px;

            justify-content: center;
            align-items: center;
        }

        .game-button {
            width: 240px;
            height: 140px;

            border: none;
            border-radius: 25px;

            background: white;
            color: #073b9c;

            font-size: 24px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 25px rgba(0,0,0,0.25);

            transition: 0.2s;
        }

        .game-button:hover {
            transform: scale(1.08);
        }


        /* =========================
           TRUTH OR DARE
        ========================= */

        .truth-dare-page {
            display: none;

            background: linear-gradient(135deg, #073b9c, #1765c5);

            justify-content: center;
            align-items: center;
            flex-direction: column;

            color: white;
            text-align: center;

            padding: 20px;
        }

        .truth-dare-page h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }

        .truth-dare-buttons {
            display: flex;
            gap: 30px;
            margin-bottom: 35px;
        }

        .truth-button,
        .dare-button {
            width: 180px;
            height: 65px;

            border: none;
            border-radius: 30px;

            background: white;
            color: #073b9c;

            font-size: 23px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 25px rgba(0,0,0,0.25);

            transition: 0.2s;
        }

        .truth-button:hover,
        .dare-button:hover {
            transform: scale(1.08);
        }

        .truth-dare-result {
            display: none;

            width: min(600px, 90vw);

            padding: 25px;

            border-radius: 20px;

            background: rgba(255,255,255,0.15);

            font-size: 22px;
            line-height: 1.5;
        }


        /* =========================
           WOULD YOU RATHER
        ========================= */

        .would-you-rather-page {
            display: none;

            background: linear-gradient(135deg, #073b9c, #1765c5);

            justify-content: center;
            align-items: center;
            flex-direction: column;

            color: white;
            text-align: center;

            padding: 20px;
        }

        .would-you-rather-page h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }

        .wyr-question {
            width: min(650px, 90vw);

            font-size: 25px;
            line-height: 1.5;

            margin-bottom: 35px;
        }

        .wyr-buttons {
            display: flex;
            gap: 25px;
        }

        .wyr-button {
            width: 240px;
            min-height: 70px;

            border: none;
            border-radius: 20px;

            background: white;
            color: #073b9c;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            padding: 12px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.25);

            transition: 0.2s;
        }

        .wyr-button:hover {
            transform: scale(1.06);
        }

        .wyr-result {
            display: none;

            margin-top: 30px;

            font-size: 22px;
            font-weight: bold;
        }


        /* =========================
           WEBSITE JOKE
        ========================= */

        .website-joke {
            position: absolute;
            bottom: 25px;

            width: 90%;

            font-size: 16px;
            opacity: 0.85;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page2 h1,
            .games-page h1,
            .truth-dare-page h1,
            .would-you-rather-page h1 {
                font-size: 28px;
                margin-bottom: 35px;
            }

            .choices,
            .game-buttons,
            .truth-dare-buttons,
            .wyr-buttons {
                flex-direction: column;
                gap: 20px;
            }

            .choice-button {
                width: min(220px, 80vw);
                height: 110px;
                font-size: 23px;
            }

            .game-button {
                width: min(260px, 85vw);
                height: 115px;
                font-size: 22px;
            }

            .truth-button,
            .dare-button {
                width: min(220px, 80vw);
            }

            .truth-dare-result {
                font-size: 18px;
            }

            .wyr-question {
                font-size: 20px;
            }

            .wyr-button {
                width: min(300px, 85vw);
            }

            .page3 h1 {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .gift-box {
                font-size: 90px;
                margin-bottom: 25px;
            }

            .gift-message {
                width: 90%;
            }

            .gift-message h2 {
                font-size: 24px;
            }

            .gift-message p {
                font-size: 18px;
            }

            .website-joke {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>


    <!-- PAGE 1 -->

    <div class="page">

        <button class="start-button" onclick="startWebsite()">
            Start →
        </button>

    </div>


    <!-- PAGE 2 -->

    <div class="page2" id="page2">

        <h1>Okay, ab tum decide karo 👀</h1>

        <div class="choices">

            <button class="choice-button" onclick="openGift()">
                🎁<br>
                Gift
            </button>

            <button class="choice-button" onclick="openGames()">
                🎮<br>
                Games
            </button>

        </div>

    </div>


    <!-- PAGE 3 - GIFT -->

    <div class="page3" id="page3">

        <h1>🎁 Ek chhota sa gift hai...</h1>

        <div class="gift-box" id="giftBox">
            🎁
        </div>

        <button
            class="open-gift-button"
            id="openGiftButton"
            onclick="revealGift()">
            Open 🎁
        </button>

        <div class="gift-message" id="giftMessage">

            <h2>Tension mat le, iPhone nahi hai 💀</h2>

            <p>
                Budget dekha toh gift khud hi bhaag gaya.
            </p>

        </div>

    </div>


    <!-- GAMES PAGE -->

    <div class="games-page" id="gamesPage">

        <h1>Okay, ab game khelte hain 😈</h1>

        <div class="game-buttons">

            <button class="game-button" onclick="openTruthDare()">
                🔥<br>
                Truth or Dare
            </button>

            <button class="game-button" onclick="openWYR()">
                🤔<br>
                Would You Rather
            </button>

        </div>

        <div class="website-joke">
            Ab bas tum unblock kar dena 😭
        </div>

    </div>


    <!-- TRUTH OR DARE PAGE -->

    <div class="truth-dare-page" id="truthDarePage">

        <h1>🔥 Truth or Dare?</h1>

        <div class="truth-dare-buttons">

            <button class="truth-button" onclick="showTruth()">
                TRUTH
            </button>

            <button class="dare-button" onclick="showDare()">
                DARE
            </button>

        </div>

        <div class="truth-dare-result" id="truthDareResult"></div>

    </div>


    <!-- WOULD YOU RATHER PAGE -->

    <div class="would-you-rather-page" id="wyrPage">

        <h1>🤔 Would You Rather?</h1>

        <div class="wyr-question">
            Would you rather have unlimited money<br>
            or unlimited free time?
        </div>

        <div class="wyr-buttons">

            <button class="wyr-button" onclick="wyrAnswer('Unlimited Money 💰')">
                Unlimited Money 💰
            </button>

            <button class="wyr-button" onclick="wyrAnswer('Unlimited Free Time 😴')">
                Unlimited Free Time 😴
            </button>

        </div>

        <div class="wyr-result" id="wyrResult"></div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function startWebsite() {

            document.querySelector(".page").style.display = "none";

            document.getElementById("page2").style.display = "flex";

        }


        /* GIFT */

        function openGift() {

            document.getElementById("page2").style.display = "none";

            document.getElementById("page3").style.display = "flex";

        }


        function revealGift() {

            document.getElementById("giftBox").style.display = "none";

            document.getElementById("openGiftButton").style.display = "none";

            document.getElementById("giftMessage").style.display = "block";

        }


        /* GAMES */

        function openGames() {

            document.getElementById("page2").style.display = "none";

            document.getElementById("gamesPage").style.display = "flex";

        }


        /* TRUTH OR DARE */

        function openTruthDare() {

            document.getElementById("gamesPage").style.display = "none";

            document.getElementById("truthDarePage").style.display = "flex";

        }


        function showTruth() {

            const result = document.getElementById("truthDareResult");

            result.style.display = "block";

            result.innerHTML =
                "👀 Ye choose nahi kar sakti, Dare choose karo 😭";

        }


        function showDare() {

            const result = document.getElementById("truthDareResult");

            result.style.display = "block";

            result.innerHTML =
                "😈 Please unblock kardo 🥲";

        }


        /* WOULD YOU RATHER */

        function openWYR() {

            document.getElementById("gamesPage").style.display = "none";

            document.getElementById("wyrPage").style.display = "flex";

        }


        function wyrAnswer(answer) {

            const result = document.getElementById("wyrResult");

            result.style.display = "block";

            result.innerHTML =
                "😂 You chose: " + answer;

        }

    </script>

</body>
</html>
