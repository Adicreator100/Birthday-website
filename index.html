<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Isha & Sneha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #073b9c;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100vw;
            height: 100vh;
            background-image: url("page1.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start-button {
            position: absolute;
            bottom: 10.5%;
            left: 50%;
            transform: translateX(-50%);

            width: 180px;
            height: 58px;

            border: none;
            border-radius: 30px;

            background: rgba(120, 205, 255, 0.95);
            color: #073b9c;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);

            transition: 0.25s ease;
        }

        .start-button:hover {
            transform: translateX(-50%) scale(1.08);
        }

        .start-button:active {
            transform: translateX(-50%) scale(0.96);
        }
    /* PAGE 2 */
.page2 {
    display: none;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #073b9c, #1765c5);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    text-align: center;
}

.page2 h1 {
    font-size: 42px;
    margin-bottom: 50px;
}

.choices {
    display: flex;
    gap: 40px;
}

.choice-button {
    width: 220px;
    height: 130px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #073b9c;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    transition: 0.2s;
}

.choice-button:hover {
    transform: scale(1.08);
}
    </style>
</head>

<body>

    <div class="page">
        <button class="start-button" onclick="startWebsite()">
            Start →
        </button>
    </div>

    <!-- PAGE 2 -->
<div class="page2" id="page2">

    <h1>Okay, ab tum decide karo 👀</h1>

    <div class="choices">

        <button class="choice-button">
            🎁<br>
            Gift
        </button>

        <button class="choice-button">
            🎮<br>
            Game
        </button>

    </div>

</div>
    <script>
    function startWebsite() {
        document.querySelector(".page").style.display = "none";
        document.getElementById("page2").style.display = "flex";
    }
</script>

</body>
</html>
